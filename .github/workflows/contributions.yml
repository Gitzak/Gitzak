name: Update contribution calendar
on:
  push:
    paths:
      - scripts/update_contributions.py
      - scripts/update_cards.py
      - .github/workflows/contributions.yml
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: contribution-calendar
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate calendar
        run: python scripts/update_contributions.py
      - name: Generate matching stats cards
        run: python scripts/update_cards.py
      - name: Save calendar
        run: |
          git add assets/*.svg
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update contribution calendar"
            git push
          fi
